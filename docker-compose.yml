# Levanta backend (FastAPI) + frontend (Vite dev con SSR) para la demo local.
#
#   docker compose up --build
#
#   Frontend → http://localhost:8080
#   Backend  → http://localhost:8000   (OpenAPI en /docs, health en /health)

services:
  backend:
    build:
      context: .
      dockerfile: Back/Dockerfile
    image: modus-backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: docker
      LOG_LEVEL: INFO
      GOOGLE_CLOUD_PROJECT: go-fest-506814
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-key.json
      FIREBASE_STORAGE_BUCKET: go-fest-506814-storage
      VERTEX_AI_REGION: us-central1
      VERTEX_AI_GEMINI_MODEL: gemini-2.0-flash
      BIGQUERY_DATASET: metricas_desastre
      AGENTS_FORCE_FALLBACK: "false"
      EXTERNAL_CALL_TIMEOUT_SECONDS: "8"
    env_file:
      - path: ./Back/.env
        required: false
    volumes:
      - ./Back/app:/app/app:z
      - ./Back/scripts:/app/scripts:z
      - ./Back/firebase-key.json:/app/firebase-key.json:ro,z
      - ./data:/data:ro,z
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    image: modus-frontend
    ports:
      - "8080:8080"
    environment:
      # URL que usa el navegador en el host
      VITE_API_URL: http://localhost:8000
      # URL interna que usa el SSR dentro de la red Docker
      API_URL_INTERNAL: http://backend:8000
      VITE_USE_MOCK: "false"
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-AIzaSyBDqvy6Wujh9xaxxkNEa7EYjyBqU6F1pk8}
    env_file:
      - path: ./frontend/.env
        required: false
    volumes:
      - ./frontend/src:/app/src:z
      - ./frontend/public:/app/public:z
    depends_on:
      backend:
        condition: service_healthy
